<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>꼬ㅊ밭을 잡아라</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#12151d;--fg:#f4f1e8;--hit:#ff4d3d;--ok:#7dffb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Black Han Sans",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;font-size:20px;pointer-events:none;text-shadow:0 2px 0 #000}
#hp{width:140px;height:12px;background:#0007;border:2px solid var(--fg);margin-top:6px}#hpf{height:100%;background:var(--ok);width:100%}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:var(--fg);box-shadow:0 0 3px #000}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#flash{position:fixed;inset:0;background:var(--hit);opacity:0;pointer-events:none;transition:opacity .25s}
#bn{position:fixed;left:0;right:0;top:28%;text-align:center;font-size:44px;text-shadow:0 3px 0 #000;opacity:0;transition:opacity .4s;pointer-events:none}#gc{font-size:16px;margin-top:4px}
#gb{position:fixed;right:136px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:74px;height:74px;border-radius:50%;background:#4a5a3acc;border:3px solid #fff;color:#fff;font-size:16px;display:none;align-items:center;justify-content:center}.touch #gb{display:flex}
#modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#rk{font-family:system-ui,sans-serif;font-size:14px;display:flex;gap:28px;text-align:left;line-height:1.6;opacity:.9}#rk b{display:block;margin-bottom:2px}
#ov{overflow:auto;position:fixed;inset:0;background:#12151dee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
#ov h1{font-size:44px;margin:0;font-weight:400}#ov p{margin:0;font-family:system-ui,sans-serif;opacity:.8;line-height:1.5;max-width:30em}
button{font:inherit;font-size:22px;padding:12px 34px;background:var(--fg);color:#12151d;border:0;border-radius:6px}
#stick,#fire{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:none}
#stick{left:28px;width:110px;height:110px;border:3px solid #fff6;border-radius:50%}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffa}
#fire{right:28px;width:92px;height:92px;border-radius:50%;background:#ff4d3dcc;border:3px solid #fff;font-size:20px;align-items:center;justify-content:center}
.touch #stick,.touch #fire{display:block}.touch #fire{display:flex}

#gm{font-size:18px;color:#ffd84a;margin-top:4px}
#pr{position:fixed;left:0;right:0;bottom:24%;text-align:center;font-size:20px;text-shadow:0 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .2s;padding:0 12px}
#scope{position:fixed;inset:0;display:none;pointer-events:none;background:radial-gradient(circle at center,transparent 0,transparent 24vmin,#000 24.4vmin)}
.tb{position:fixed;width:60px;height:60px;border-radius:50%;border:3px solid #fff;color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.touch .tb{display:flex}
#sb{display:none;left:50%;margin-left:-40px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:80px;height:80px;background:#2fbf6acc;font-size:18px}
#shop{position:fixed;inset:0;z-index:40;background:#12151df5;display:none;flex-direction:column;align-items:center;justify-content:flex-start;-webkit-overflow-scrolling:touch;gap:10px;padding:18px;overflow:auto;font-family:system-ui,sans-serif;text-align:center}
#shop h2{font-family:"Black Han Sans",system-ui,sans-serif;font-weight:400;font-size:36px;margin:0}
#shop .g{font-size:20px;color:#ffd84a;font-weight:700}
.it{display:flex;align-items:center;gap:12px;background:#ffffff14;border-radius:8px;padding:10px 14px;width:min(580px,92vw);box-sizing:border-box;text-align:left}
.it div{flex:1;font-size:17px;font-weight:700}.it small{display:block;opacity:.7;font-size:12.5px;font-weight:400;margin-top:3px;line-height:1.4}
.it button{font-size:15px;padding:9px 16px;white-space:nowrap}.it button:disabled{opacity:.35}
#shop .row{display:flex;gap:12px;margin-top:6px}

#bb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;transform:translateX(-50%);width:min(420px,60vw);display:none;text-align:center;pointer-events:none;font-size:15px;text-shadow:0 2px 0 #000}
#bbb{height:12px;background:#0008;border:2px solid #ff4d3d;margin-top:3px}#bbf{height:100%;background:#ff4d3d;width:100%}
#st{position:fixed;inset:0;z-index:50;background:#12151df8;display:none;flex-direction:column;align-items:center;gap:12px;padding:20px;overflow:auto;font-family:system-ui,sans-serif;text-align:center}
#st h2{font-family:"Black Han Sans",system-ui,sans-serif;font-weight:400;font-size:34px;margin:0}
.sg{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:820px}
.sc{background:#ffffff12;border-radius:10px;padding:14px 16px;flex:1;min-width:280px;text-align:left;display:flex;flex-direction:column;gap:8px}
.sc small{opacity:.65;font-size:12px}
.kr{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
.kr button,.sc button,#st>button,#ed button{font-size:14px;padding:7px 14px;min-width:84px}
.sl{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px}.sl input{width:100%}
#ed{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:none;gap:10px;align-items:center;background:#000b;padding:8px 14px;border-radius:8px;font-family:system-ui,sans-serif;font-size:14px}
.edit #stick,.edit #fire,.edit #gb,.edit .tb{display:flex!important;outline:2px dashed #ffd84a;cursor:move;z-index:55}
.edit #stick{display:block!important}
.mp{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.mc{font-family:system-ui,sans-serif;background:#ffffff14;color:#f4f1e8;border:2px solid #ffffff33;padding:9px 14px;font-size:13px;text-align:left;min-width:150px;line-height:1.4;border-radius:8px}
.mpv{display:block;width:210px;height:128px;object-fit:cover;margin-top:6px;border-radius:6px;image-rendering:auto}.mc small{display:block;font-size:10px;opacity:.7;margin-top:2px}.mc b{display:block;font-size:16px}.mc.on{border-color:#7dffb0;background:#7dffb033}
#cine{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;background:linear-gradient(#000 0,#000 11%,transparent 11%,transparent 89%,#000 89%)}#cine:after{content:'BOSS';position:absolute;left:0;right:0;bottom:13%;text-align:center;color:#ff4d3d;font-size:30px;letter-spacing:10px;text-shadow:0 3px 0 #000}
#dx{position:fixed;inset:0;z-index:60;background:#12151df8;display:none;flex-direction:column;align-items:center;gap:12px;padding:20px;overflow:auto;font-family:system-ui,sans-serif;text-align:center}
#dx h2{font-family:"Black Han Sans",system-ui,sans-serif;font-weight:400;font-size:34px;margin:0}
.dc{display:flex;gap:14px;background:#ffffff14;border-radius:10px;padding:12px;width:min(660px,94vw);box-sizing:border-box;text-align:left}
.dc img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#0006;flex:none}
.dc b{font-size:18px}.dc .tg{font-size:12px;opacity:.7;margin-left:6px}.dc p{margin:4px 0 0;font-size:13.5px;line-height:1.5;opacity:.9;max-width:none}.dc ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.55}.dc .bs{color:#ff9a8a}
#dx>button{font-size:15px;padding:8px 22px}
#shop>:first-child{margin-top:auto}#shop>:last-child{margin-bottom:auto}
#pink,#stunv{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity .25s}#pink{background:radial-gradient(circle,#ff9ad020 0%,#ff4fa0aa 100%)}#stunv{background:radial-gradient(circle,#0000 35%,#0b1230aa 100%)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div>점수 <span id="sc">0</span><div id="hp"><div id="hpf"></div></div><div id="cine"></div><div id="bb"><div id="bbn"></div><div id="bbb"><div id="bbf"></div></div></div><div id="gm">골드 <span id="gold">0</span></div><div id="gc"></div></div><div><span id="wl">웨이브</span> <span id="wv">1</span></div></div>
<div id="cross"></div><div id="flash"></div><div id="bn"></div><div id="gb">수류탄</div>
<div id="stick"><div id="knob"></div></div><div id="fire">발사</div>
<div class="tb" id="mb" style="right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);background:#d9722ecc"></div>
<div class="tb" id="fb" style="right:98px;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);background:#8a8fb8cc"></div>
<div class="tb" id="jb" style="background:#3a8fd9cc">점프</div>
<div class="tb" id="wb" style="right:168px;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);background:#3a3f47cc">무기<br>교체</div>
<div class="tb" id="sb">상점</div><div class="tb" id="rb" style="background:#7a5a2acc">재장전</div>
<div id="scope"></div><div id="pr"></div>
<div id="shop"></div><div id="dx"></div><div id="pink"></div><div id="stunv"></div><div id="st"></div><div id="ed"><span>버튼을 드래그해서 옮기세요</span><button onclick="resetPos()">위치 초기화</button><button onclick="closeEdit()">완료</button></div>
<div id="ov"><h1 id="t">꼬ㅊ밭을 잡아라</h1><p id="d">웨이브 모드: 15웨이브 클리어가 목표예요. 웨이브마다 마지막에 보스가 한 명 나오고, 1웨이브부터 상점이 열려요.<br>무한 모드: 쓰러질 때까지 계속 나와요.<br>맵을 고른 뒤 모드를 시작하세요. 키 · 버튼 크기 · 버튼 위치는 ⚙ 설정에서 바꿔요.</p><div class="mp" id="mps"></div><div id="modes"><button id="gw">웨이브 모드</button><button id="gi">무한 모드</button></div><button id="gs" style="font-size:16px;padding:8px 22px;background:#ffffff22;color:#f4f1e8;margin-top:8px" onclick="openSet()">⚙ 조작 설정 (키 · 크기 · 버튼 위치)</button><button id="gdx" style="font-size:16px;padding:8px 22px;background:#ffffff22;color:#f4f1e8;margin-top:8px" onclick="openDex()">📖 몹 도감</button><div style="margin:6px 0"><input id="pn" maxlength="12" placeholder="랭킹 닉네임 (최대 12자)" style="font-size:16px;padding:8px 12px;border-radius:8px;border:2px solid #ffffff44;background:#ffffff14;color:#f4f1e8;text-align:center;width:220px"></div><div id="rk"></div></div>
